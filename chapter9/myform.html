<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
  </head>
  <body>
    <form action="mydata.html" method="post" >
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" />

      <br>
      <label for="password">Password:</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter password" required
      />

      <br>
      <label for="email">Email:</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
      />
<br>
      <label for="age">Age:</label>
      <input type="number" id="age" name="age" min="1" max="100" />


      <p>Gender:</p> 
<input type="radio" id="male" name="my" 
value="male"> 
<label for="male">Male</label> 
<input type="radio" id="female" name="my" 
value="female"> 
<label for="female">Female</label> 


<input type="radio" id="female" name="my" 
value="female"> 
<label for="female">Other</label> 


<p>Hobbies:</p> 
<input type="checkbox" id="reading" name="hobby" 
value="reading"> 
<label for="reading">Reading</label> 
<input type="checkbox" id="reading" name="hobby" 
value="reading"> 
<label for="reading">Painting</label> 
<input type="checkbox" id="sports" name="hobby" 
value="sports"> 
<label for="sports">Sports</label> 


<label for="message">Message:</label> 
<textarea id="message" name="message" rows="4" 
cols="50" placeholder="Type your message 
here"></textarea> 


<input type="submit" value="Submit"> 
<input type="reset" value="Reset"> 
    </form>
  </body>
</html>
