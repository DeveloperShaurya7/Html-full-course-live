<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Id selector</title>

    <style>
        p {
            color: red;
        }

        #para {
            color: blue;
        }
        .mycls{
            background-color: #38d48c;
        }
    </style>
</head>
<body>
    <p class="mycls">This is a paragraph 1</p>
    <p class="mycls">This is a paragraph 2</p>
    <p id="para">This is a paragraph 3</p>
    <p class="mycls">This is a paragraph 4</p>
    <p style="border: 5px solid yellow;">This is a paragraph 5</p>



    
</body>
</html>
