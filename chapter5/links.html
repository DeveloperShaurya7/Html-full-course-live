<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
</head>
<body>
    <a href="index.html">Home page</a> <br><br>
    <!-- Opens in same page -->
    <a href="https://developershaurya.com/">My website</a>
    <br>

    <!-- Opens in new tab -->
    <a href="https://developershaurya.com/" target="_blank">My website</a>
    <br>

    <!-- For security when use target="_blank" -->
    <a href="https://www.google.com" target="_blank" 
    rel="noopener noreferrer">Google</a> 
</body>
</html>
